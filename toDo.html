<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="toDo.css">
</head>
<body>
    <div id="container">
        <h2>To Do List</h2>

        </div>
        <p id="error"></p>
        <ul id="taskList">  </ul>
    </div>
    <script src="toDo.js"></script>
    
</body>
</html>
